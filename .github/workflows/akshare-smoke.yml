name: AKShare live smoke test

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akshare-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install latest AKShare
        run: python -m pip install --upgrade akshare

      # 每组给多个候选，任一成功即视为该类数据源可用；整组失败才重试首选。
      # 单接口耗时差异大（index_zh_a_hist 冷启动要分页拉量表），超时按接口在脚本内单独放宽。
      - name: Run live smoke test
        run: |
          set -o pipefail
          python scripts/smoke.py \
            --timeout 60 \
            --retries 1 \
            --json \
            --summary "$GITHUB_STEP_SUMMARY" \
            | tee akshare-smoke.json

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akshare-smoke-report
          path: akshare-smoke.json
          if-no-files-found: ignore